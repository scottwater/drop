name = "drop"
main = "src/index.js"
compatibility_date = "2026-03-15"
# OAuth client metadata documents (CIMD) are fetched from client URLs; never let
# those fetches reach private or same-zone addresses.
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

# Routes and R2 bucket names are intentionally not hardcoded here.
# Use `npm run dev` or `npm run deploy` with these shell env vars to inject them:
# - DROP_BUCKET_NAME
# - DROP_PREVIEW_BUCKET_NAME
# - DROP_ROUTE_PATTERN      (optional, but must be paired with DROP_ROUTE_ZONE_NAME)
# - DROP_ROUTE_ZONE_NAME    (optional, but must be paired with DROP_ROUTE_PATTERN)

[vars]
APP_NAME = "Drop"

# Secrets to set with `wrangler secret put`:
# - OWNER_USERNAME
# - OWNER_PASSWORD
# - SESSION_SECRET   (long random value; weak values shorter than 32 chars are rejected) use: `openssl rand -base64 32`
# - CLI_TOKENS       (comma-separated bearer tokens)
#
# Optional vars:
# - LOGIN_RATE_LIMIT_MAX_ATTEMPTS   (default 5)
# - LOGIN_RATE_LIMIT_WINDOW_SECONDS (default 900)
# - LOGIN_RATE_LIMIT_BLOCK_SECONDS  (default 900)
#
# Optional: PUBLIC_ORIGIN (e.g. "https://drop.example.com") pins the OAuth issuer
# and MCP URL to one hostname. Without it, each hostname the Worker answers on
# (custom domain, workers.dev) acts as its own issuer.

# OAuth clients, grants and tokens for the MCP server at /mcp. Wrangler creates
# the namespace on first deploy. Without this binding, /mcp and /oauth/* 404.
[[kv_namespaces]]
binding = "OAUTH_KV"
